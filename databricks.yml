bundle:
  name: vanderlande-warehousing-appkit

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.

resources:
  apps:
    app:
      name: "vanderlande-warehousing-appkit"
      description: "AppKit rebuild - Vanderlande Warehousing installed-base risk, configuration compliance, and strategic account intelligence (React/TypeScript)."
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # On-behalf-of scopes. `sql` lets the analytics queries run as the
      # signed-in user; `genie` does the same for the Ask Genie page (this
      # workspace names the scope `genie`, matching the existing production app).
      # The catalog/iam read scopes let the app resolve names and identity.
      user_api_scopes:
        - sql
        - genie
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
        - iam.access-control:read
        - iam.current-user:read

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://fevm-serverless-stable-cps4hg.cloud.databricks.com

    variables:
      sql_warehouse_id: 71f626c15d31970f
      genie_space_id: 01f19d62e6e41f81b94273ab1ced7101
      genie_space_name: Vanderlande Warehousing Intelligence
      postgres_branch: projects/ddi-omnigent-appkit-state/branches/production
      postgres_database: projects/ddi-omnigent-appkit-state/branches/production/databases/databricks-postgres
      postgres_project: projects/ddi-omnigent-appkit-state
